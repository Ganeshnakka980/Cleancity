<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanCity — Citizen Registration</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <main class="pt-28 pb-16 px-4 flex-1 flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900">Create Citizen Account</h2>
        <p class="text-xs text-slate-500 mt-1">Join CleanCity to report waste & earn EcoPoints</p>
      </div>

      <div id="register-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium"></div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
          <input type="text" id="name" required placeholder="John Doe" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
          <input type="tel" id="phone" placeholder="+91 9876543210" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <button type="submit" id="btn-register" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg shadow-emerald-200 transition">
          Register & Claim 10 Bonus Points 🎉
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500">
        Already registered? <a href="/login.html" class="font-bold text-emerald-600 hover:underline">Sign In Here</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/components/navbar.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();

      const form = document.getElementById('register-form');
      const errorDiv = document.getElementById('register-error');
      const btn = document.getElementById('btn-register');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Registering account...';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;

        try {
          const response = await API.register({ name, email, phone, password });
          API.setAuth(response.token, response.data);
          window.location.href = '/citizen/dashboard.html';
        } catch (err) {
          errorDiv.textContent = err.message || 'Registration failed. Please try again.';
          errorDiv.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Register & Claim 10 Bonus Points 🎉';
        }
      });
    });
  </script>
</body>
</html>
