<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanCity — Login</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <main class="pt-28 pb-16 px-4 flex-1 flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-900">Sign In to CleanCity</h2>
        <p class="text-xs text-slate-500 mt-1">Access your citizen, staff, or administrator workspace</p>
      </div>

      <!-- Quick Demo Credentials Filler Buttons -->
      <div class="mb-6 p-3 bg-slate-50 rounded-2xl border border-slate-200">
        <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 text-center">Quick Demo Autofill</div>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="fillDemo('admin')" class="px-2 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-800 text-xs font-bold rounded-xl transition">Admin</button>
          <button onclick="fillDemo('staff')" class="px-2 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-800 text-xs font-bold rounded-xl transition">Staff</button>
          <button onclick="fillDemo('citizen')" class="px-2 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs font-bold rounded-xl transition">Citizen</button>
        </div>
      </div>

      <div id="login-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="user@cleancity.com" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <button type="submit" id="btn-login" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg shadow-emerald-200 transition">
          Sign In
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account yet? <a href="/register.html" class="font-bold text-emerald-600 hover:underline">Register Citizen Account</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/components/navbar.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();

      const form = document.getElementById('login-form');
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const response = await API.login({ email, password });
          API.setAuth(response.token, response.data);
          Auth.redirectUserByRole(response.data.role);
        } catch (err) {
          errorDiv.textContent = err.message || 'Login failed. Please check credentials.';
          errorDiv.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    });

    function fillDemo(role) {
      if (role === 'admin') {
        document.getElementById('email').value = 'admin@cleancity.com';
        document.getElementById('password').value = 'Admin@123';
      } else if (role === 'staff') {
        document.getElementById('email').value = 'staff@cleancity.com';
        document.getElementById('password').value = 'Staff@123';
      } else if (role === 'citizen') {
        document.getElementById('email').value = 'citizen@cleancity.com';
        document.getElementById('password').value = 'Citizen@123';
      }
    }
  </script>
</body>
</html>
