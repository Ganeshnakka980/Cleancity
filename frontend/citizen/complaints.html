<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanCity — Complaints Registry</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="flex flex-1 pt-16">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Container -->
    <main class="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900">Complaints Registry</h1>
          <p class="text-xs text-slate-500 mt-1">Browse, search, and track waste reports with status filtering.</p>
        </div>

        <a href="/citizen/report.html" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition self-start md:self-auto">
          + Report Waste Issue
        </a>
      </div>

      <!-- Filters & Search Bar -->
      <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Search Keyword</label>
          <input type="text" id="search-input" placeholder="ID, address, description..." class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status Filter</label>
          <select id="status-filter" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="assigned">Assigned</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="verified">Verified</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Category Filter</label>
          <select id="category-filter" class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
            <option value="">All Categories</option>
            <option value="General Garbage">General Garbage</option>
            <option value="Plastic Waste">Plastic Waste</option>
            <option value="Overflowing Bin">Overflowing Bin</option>
            <option value="Illegal Dumping">Illegal Dumping</option>
            <option value="Construction Waste">Construction Waste</option>
            <option value="E-Waste">E-Waste</option>
            <option value="Organic Waste">Organic Waste</option>
          </select>
        </div>
      </div>

      <!-- Complaints Container -->
      <div id="complaints-container"></div>

      <!-- Pagination Controls -->
      <div id="pagination-container"></div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/complaints.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/sidebar.js"></script>
  <script src="/components/loader.js"></script>
  <script src="/components/notification.js"></script>
</body>
</html>
