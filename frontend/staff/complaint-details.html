<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin-when-cross-origin">
  <title>CleanCity — Staff Task Resolution</title>
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="flex flex-1 pt-16">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 lg:p-10 max-w-6xl mx-auto w-full">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <a href="/staff/dashboard.html" class="text-xs font-bold text-slate-500 hover:text-emerald-600 mb-1 inline-block">&larr; Back to Staff Tasks</a>
          <h1 class="text-2xl font-extrabold text-slate-900" id="detail-complaint-id">Task Details</h1>
        </div>
        <div id="detail-status-badge"></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
          <!-- Photos Section -->
          <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Task Photos</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <span class="block text-xs font-bold text-slate-700 mb-2">Reported Waste Photo</span>
                <div class="h-56 rounded-2xl overflow-hidden bg-slate-100 border border-slate-200">
                  <img id="detail-report-img" class="w-full h-full object-cover" alt="Reported photo">
                </div>
              </div>

              <div>
                <span class="block text-xs font-bold text-emerald-700 mb-2">Resolution Proof Photo</span>
                <div class="h-56 rounded-2xl overflow-hidden bg-emerald-50 border border-emerald-200 flex items-center justify-center text-center p-4">
                  <p class="text-xs text-slate-400 font-medium" id="resolution-photo-placeholder">Resolution proof photo will appear once submitted.</p>
                  <img id="detail-resolution-img" class="hidden w-full h-full object-cover" alt="Resolution photo">
                </div>
              </div>
            </div>

            <!-- Action Buttons -->
            <div id="staff-action-bar" class="pt-4 border-t border-slate-100 flex gap-3">
              <!-- Rendered dynamically -->
            </div>
          </div>

          <!-- Real Status History Timeline -->
          <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Task Progress Timeline</h3>
            <div class="relative pl-6 space-y-6" id="detail-timeline-container"></div>
          </div>
        </div>

        <div class="space-y-6">
          <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Reporter & Location</h3>
            <div class="space-y-3 text-xs">
              <div>
                <span class="text-slate-400 block font-semibold">Category</span>
                <span class="font-bold text-slate-800 text-sm" id="detail-category">-</span>
              </div>
              <div>
                <span class="text-slate-400 block font-semibold">Priority</span>
                <span class="font-bold capitalize text-slate-800" id="detail-priority">-</span>
              </div>
              <div>
                <span class="text-slate-400 block font-semibold">Description</span>
                <p class="text-slate-700 leading-relaxed" id="detail-description">-</p>
              </div>
              <div>
                <span class="text-slate-400 block font-semibold">Citizen Contact</span>
                <span class="font-bold text-slate-800" id="detail-citizen-info">-</span>
              </div>
            </div>
          </div>

          <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 px-2">Location Map</h3>
            <p class="text-xs text-slate-600 px-2 truncate font-medium" id="detail-address">-</p>
            <div id="detail-map" class="h-56 w-full rounded-2xl border border-slate-200 z-10"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Resolution Proof Modal -->
  <div id="resolution-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-900">Upload Cleaning Proof</h3>
        <button onclick="Modal.close('resolution-modal')" class="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
      </div>

      <form id="resolution-form" onsubmit="submitResolutionForm(event)" class="space-y-4">
        <input type="hidden" id="modal-complaint-id">

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Proof Photo (After Cleanup) *</label>
          <input type="file" name="resolutionImage" accept="image/jpeg,image/jpg,image/png,image/webp" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Resolution Notes</label>
          <textarea name="resolutionNote" rows="3" placeholder="Describe cleaning work done..." class="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>

        <button type="submit" id="btn-submit-proof" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg transition">
          Upload Proof & Resolve Complaint
        </button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/staff.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/sidebar.js"></script>
  <script src="/components/loader.js"></script>
  <script src="/components/modal.js"></script>
  <script src="/components/notification.js"></script>

  <script>
    let currentTask = null;

    document.addEventListener('DOMContentLoaded', () => {
      const user = Auth.requireAuth(['staff', 'admin']);
      if (!user) return;

      renderNavbar('complaints');
      renderSidebar('complaints');

      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (id) loadTaskDetails(id);
    });

    async function loadTaskDetails(id) {
      try {
        const res = await API.getComplaint(id);
        currentTask = res.data;
        renderTaskDetails(currentTask);
      } catch (err) {
        showToast('Error', 'Failed to load task details', 'danger');
      }
    }

    function renderTaskDetails(c) {
      document.getElementById('detail-complaint-id').textContent = `${c.complaintId}: ${c.category}`;
      document.getElementById('detail-status-badge').innerHTML = `<span class="px-4 py-1.5 text-xs font-extrabold rounded-full badge-${c.status}">${c.status.replace('_', ' ').toUpperCase()}</span>`;

      document.getElementById('detail-category').textContent = c.category;
      document.getElementById('detail-priority').textContent = `${c.priority.toUpperCase()} priority`;
      document.getElementById('detail-description').textContent = c.description;
      document.getElementById('detail-citizen-info').textContent = c.userId ? `${c.userId.name} (${c.userId.phone || 'No phone'})` : 'Citizen';
      document.getElementById('detail-address').textContent = `📍 ${c.address || 'Location specified'}`;

      document.getElementById('detail-report-img').src = c.image || '/uploads/seed-waste-1.svg';
      if (c.resolutionImage) {
        document.getElementById('detail-resolution-img').src = c.resolutionImage;
        document.getElementById('detail-resolution-img').classList.remove('hidden');
        document.getElementById('resolution-photo-placeholder').classList.add('hidden');
      }

      if (c.location && c.location.coordinates) {
        CleanCityMap.init('detail-map', { lat: c.location.coordinates[1], lng: c.location.coordinates[0], zoom: 15 });
        CleanCityMap.addComplaintMarkers([c]);
      }

      // Action Bar
      const actionBar = document.getElementById('staff-action-bar');
      if (c.status === 'assigned') {
        actionBar.innerHTML = `<button onclick="acceptTask('${c._id}')" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md">Accept Assignment & Start Work</button>`;
      } else if (c.status === 'in_progress') {
        actionBar.innerHTML = `<button onclick="openResolutionModal('${c._id}', '${c.complaintId}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md">Upload Proof Photo & Mark Resolved</button>`;
      } else {
        actionBar.innerHTML = `<div class="p-3 bg-emerald-50 text-emerald-800 text-xs font-bold rounded-xl w-full text-center">Cleaning Task Completed ✓</div>`;
      }

      // Render timeline
      const container = document.getElementById('detail-timeline-container');
      container.innerHTML = `
        <div class="timeline-line"></div>
        ${(c.statusHistory || []).map((step, idx) => `
          <div class="relative z-10 flex items-start gap-4">
            <div class="w-7 h-7 rounded-full bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shrink-0 shadow-md">${idx + 1}</div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex-1">
              <div class="flex items-center justify-between mb-1">
                <span class="font-extrabold text-xs text-slate-800 uppercase">${step.status.replace('_', ' ')}</span>
                <span class="text-[10px] font-semibold text-slate-400">${new Date(step.changedAt).toLocaleString()}</span>
              </div>
              <p class="text-xs text-slate-600">${step.note || 'Status update'}</p>
            </div>
          </div>
        `).join('')}
      `;
    }
  </script>
</body>
</html>
