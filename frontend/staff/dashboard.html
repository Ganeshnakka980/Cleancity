<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanCity — Municipal Staff Dashboard</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <div class="flex flex-1 pt-16">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
      <!-- Header -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-6 lg:p-8 text-white shadow-xl shadow-blue-200/50 mb-8">
        <div class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-bold mb-2">FIELD STAFF WORKSPACE</div>
        <h1 class="text-2xl lg:text-3xl font-extrabold">Assigned Field Tasks & Cleaning Workload</h1>
        <p class="text-xs lg:text-sm text-blue-100 mt-1">Accept complaints, execute field cleanups, and submit resolution proof photos.</p>
      </div>

      <!-- Workload Stats -->
      <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Assigned</div>
          <div class="text-2xl font-extrabold text-slate-900" id="staff-stat-total">0</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-1">Pending Accept</div>
          <div class="text-2xl font-extrabold text-amber-600" id="staff-stat-pending">0</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs font-bold text-purple-500 uppercase tracking-wider mb-1">In Progress</div>
          <div class="text-2xl font-extrabold text-purple-600" id="staff-stat-in-progress">0</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs font-bold text-emerald-500 uppercase tracking-wider mb-1">Resolved</div>
          <div class="text-2xl font-extrabold text-emerald-600" id="staff-stat-resolved">0</div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm col-span-2 lg:col-span-1">
          <div class="text-xs font-bold text-blue-500 uppercase tracking-wider mb-1">Resolution Rate</div>
          <div class="text-2xl font-extrabold text-blue-600" id="staff-stat-rate">0%</div>
        </div>
      </div>

      <!-- Assigned Tasks Section -->
      <div class="space-y-4">
        <h2 class="text-lg font-extrabold text-slate-900">Your Field Work Queue</h2>
        <div id="staff-tasks-container"></div>
      </div>
    </main>
  </div>

  <!-- Resolution Proof Modal -->
  <div id="resolution-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-900">Upload Cleaning Proof</h3>
        <button onclick="Modal.close('resolution-modal')" class="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
      </div>

      <p class="text-xs text-slate-500 mb-4">Target Complaint: <span class="font-bold text-slate-800" id="modal-complaint-label"></span></p>

      <form id="resolution-form" onsubmit="submitResolutionForm(event)" class="space-y-4">
        <input type="hidden" id="modal-complaint-id">

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Proof Photo (After Cleanup) *</label>
          <input type="file" name="resolutionImage" accept="image/jpeg,image/jpg,image/png,image/webp" required class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Resolution Notes</label>
          <textarea name="resolutionNote" rows="3" placeholder="Describe cleaning work done, recycling center transfer, etc..." class="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>

        <button type="submit" id="btn-submit-proof" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg transition">
          Upload Proof & Resolve Complaint
        </button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/staff.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/sidebar.js"></script>
  <script src="/components/loader.js"></script>
  <script src="/components/modal.js"></script>
  <script src="/components/notification.js"></script>
</body>
</html>
